name: .NET Core CI

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: '11.0.x'

    - name: Restore dependencies
      run: dotnet restore RunaString.slnx

    - name: Build solution
      run: dotnet build RunaString.slnx --no-restore

    - name: Run tests
      run: dotnet test RunaString.slnx --no-build --verbosity normal

name: .NET Core CI

on:
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Setup .NET
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore RunaString.slnx

    - name: Build solution
      run: dotnet build RunaString.slnx --no-restore

    - name: Run tests
      run: dotnet test RunaString.slnx --no-build --verbosity normal
